<!DOCTYPE html>
<html
        lang="ko"
        xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 추천곡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* LP판 회전 애니메이션 */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-950 text-white relative overflow-hidden">

<!-- 배경 네온 조명 효과 -->
<div class="absolute top-1/4 -left-20 w-72 h-72 bg-purple-600/30 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 -right-20 w-72 h-72 bg-pink-600/30 rounded-full blur-[100px] pointer-events-none"></div>

<!-- 타이틀 영역 -->
<div class="text-center mb-8 z-10">
    <span class="inline-block py-1 px-3 rounded-full bg-white/10 border border-white/10 text-xs font-semibold tracking-widest text-purple-300 uppercase mb-3">
        Today's Pick
    </span>
    <h2 class="text-4xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-white via-purple-200 to-pink-300 bg-clip-text text-transparent">
        오늘의 추천 노래
    </h2>
</div>

<!-- 노래 카드 영역 -->
<div th:object="${song}" th:if="${song} != null"
     class="relative z-10 bg-white/[0.06] backdrop-blur-xl border border-white/15 p-8 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.6)] w-full max-w-md transition-all duration-500 hover:border-purple-500/40 hover:shadow-purple-500/10">

    <!-- 회전하는 미니 LP판 장식 -->
    <div class="flex justify-center mb-6">
        <div class="relative w-20 h-20 rounded-full bg-gradient-to-tr from-slate-900 via-slate-800 to-slate-900 border-2 border-white/10 shadow-xl flex items-center justify-center animate-spin-slow">
            <!-- LP판 홈 디테일 -->
            <div class="w-14 h-14 rounded-full border border-white/5 flex items-center justify-center">
                <div class="w-7 h-7 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center">
                    <div class="w-2 h-2 rounded-full bg-slate-950"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="space-y-4">
        <!-- 제목 박스 -->
        <div class="p-4 rounded-2xl bg-slate-900/60 border border-white/5 transition-colors hover:bg-slate-900/80">
            <p class="text-[11px] font-bold text-purple-400 uppercase tracking-widest mb-1 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-purple-400 animate-pulse"></span>
                Title
            </p>
            <p class="text-2xl font-extrabold text-white break-words leading-snug"
               th:text="*{title}">
                노래 제목
            </p>
        </div>

        <!-- 가수 박스 -->
        <div class="p-4 rounded-2xl bg-slate-900/60 border border-white/5 transition-colors hover:bg-slate-900/80">
            <p class="text-[11px] font-bold text-pink-400 uppercase tracking-widest mb-1 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-pink-400"></span>
                Artist
            </p>
            <p class="text-lg font-medium text-slate-300 break-words"
               th:text="*{artist}">
                가수 이름
            </p>
        </div>

        <!-- 버튼 영역 -->
        <div class="pt-4 space-y-3">
            <a th:href="@{'https://www.youtube.com/results?search_query=노래방 ' + *{artist} + ' ' + *{title}}"
               target="_blank"
               class="group w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 rounded-2xl
                      hover:from-purple-500 hover:to-pink-500 transition-all duration-300 shadow-[0_0_25px_rgba(168,85,247,0.4)] hover:shadow-[0_0_35px_rgba(236,72,153,0.6)]
                      font-bold text-lg transform hover:-translate-y-0.5 active:scale-95">
                <!-- 마이크 아이콘 -->
                <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                </svg>
                <span>노래방 반주 바로가기</span>
            </a>

            <a th:href="@{/songs/random}"
               class="w-full flex items-center justify-center gap-2 bg-white/5 border border-white/10 text-slate-300 py-3.5 rounded-2xl
                      hover:bg-white/10 hover:text-white hover:border-white/20 transition-all duration-300 font-semibold active:scale-95">
                <!-- 새로고침 아이콘 -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span>다른 노래 추천받기</span>
            </a>
        </div>
    </div>
</div>

<!-- 노래가 없을 때 (Empty State) -->
<div th:unless="${song}"
     class="relative z-10 text-center p-10 bg-white/[0.06] backdrop-blur-xl border border-white/15 rounded-3xl shadow-2xl w-full max-w-md">
    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
    </div>
    <p class="text-xl text-rose-400 font-bold mb-1">
        추천할 노래가 없습니다
    </p>
    <p class="text-sm text-slate-400 mb-6">
        등록된 노래 데이터가 비어있어요.
    </p>
    <a th:href="@{/songs/random}"
       class="inline-block px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white text-sm font-semibold transition">
        다시 시도하기
    </a>
</div>

</body>
</html>
